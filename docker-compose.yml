version: '3.8'

services:
  app:
    build: .
    container_name: sarhan_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/sarhan-indicators
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    container_name: sarhan_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
