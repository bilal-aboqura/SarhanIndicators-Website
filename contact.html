<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تواصل معنا — Sarhan Indicators</title>
  <link rel="icon" type="image/png" href="/assets/images/logo.png" />
  <link rel="stylesheet" href="/src/index.css" />
  <script type="module" src="/src/i18n.js"></script>
  <script type="module" src="/src/components.js"></script>
  <style>
    .contact-page {
      padding-top: calc(var(--navbar-height) + var(--sp-4xl));
      padding-bottom: var(--sp-4xl);
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    
    /* Ambient Glows */
    .contact-glow-1 {
      position: absolute;
      top: 10%;
      right: 15%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(5, 150, 105, 0.15) 0%, transparent 70%);
      filter: blur(60px);
      z-index: -1;
      animation: float-pulse 8s ease-in-out infinite alternate;
    }
    .contact-glow-2 {
      position: absolute;
      bottom: 20%;
      left: 10%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(91, 141, 239, 0.1) 0%, transparent 70%);
      filter: blur(60px);
      z-index: -1;
      animation: float-pulse 10s ease-in-out infinite alternate-reverse;
    }

    .contact-header {
      text-align: center;
      margin-bottom: var(--sp-4xl);
      z-index: 2;
    }
    .contact-header h1 {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: var(--fw-black);
      margin-bottom: var(--sp-md);
      background: linear-gradient(135deg, var(--clr-text) 0%, rgba(255,255,255,0.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
    }
    .contact-header p {
      color: var(--clr-text-secondary);
      font-size: 1.25rem;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
    }
    .contact-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--sp-2xl);
      width: 100%;
      max-width: 1100px;
      padding: 0 var(--sp-lg);
      z-index: 2;
    }

    @media (max-width: 992px) {
      .contact-cards {
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      }
    }
    .contact-card {
      background: rgba(20, 25, 30, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: 24px;
      padding: var(--sp-3xl) var(--sp-xl);
      text-align: center;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-lg);
      position: relative;
      overflow: hidden;
    }
    
    /* Card Hover Effect */
    .contact-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: inherit;
      padding: 2px;
      background: linear-gradient(135deg, rgba(5,150,105,0.5), transparent 60%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .contact-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), var(--shadow-glow-accent);
      background: rgba(20, 25, 30, 0.6);
    }
    .contact-card:hover::before {
      opacity: 1;
    }

    .contact-icon-wrapper {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(5, 150, 105, 0.15), rgba(5, 150, 105, 0.05));
      border: 1px solid rgba(5, 150, 105, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--clr-accent);
      margin-bottom: var(--sp-xs);
      box-shadow: 0 8px 32px rgba(5, 150, 105, 0.1);
      transition: transform 0.3s ease;
    }
    .contact-card:hover .contact-icon-wrapper {
      transform: scale(1.1) rotate(5deg);
    }
    .contact-icon-wrapper svg {
      width: 36px;
      height: 36px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }
    
    .contact-info {
        display: flex;
        flex-direction: column;
        gap: var(--sp-xs);
    }

    .contact-card h3 {
      font-size: 1.4rem;
      font-weight: var(--fw-bold);
      color: var(--clr-text);
      margin: 0;
      letter-spacing: -0.5px;
    }
    .contact-value {
      font-size: 1.15rem;
      color: var(--clr-text-secondary);
      margin: 0;
      direction: ltr;
      font-weight: 500;
      margin-top: 5px;
    }
    .contact-value.rtl-text {
        direction: rtl;
    }
    .contact-link {
      color: var(--clr-text-secondary);
      text-decoration: none;
      transition: all 0.3s ease;
      position: relative;
    }
    
    /* Interactive Link Underline */
    .contact-link::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 2px;
      bottom: -4px;
      left: 0;
      background-color: var(--clr-accent);
      transform: scaleX(0);
      transform-origin: bottom right;
      transition: transform 0.3s ease-out;
    }
    .contact-link:hover {
      color: var(--clr-text);
    }
    .contact-link:hover::after {
      transform: scaleX(1);
      transform-origin: bottom left;
    }

    @keyframes float-pulse {
      0% { transform: translateY(0) scale(1); opacity: 0.5; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-20px) scale(1.05); opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <!-- ===== NAVBAR ===== -->
    <div id="navbar-placeholder"></div>

    <section class="contact-page">
      <!-- Ambient Glows -->
      <div class="contact-glow-1"></div>
      <div class="contact-glow-2"></div>

      <div class="contact-header reveal">
        <h1 data-i18n="contact.title">تواصل معنا</h1>
        <p data-i18n="contact.subtitle">نحن هنا للإجابة على جميع استفساراتك ومساعدتك في أي وقت.</p>
      </div>

      <div class="contact-cards reveal">
        <!-- Phone / WhatsApp -->
        <div class="contact-card">
          <div class="contact-icon-wrapper">
             <svg viewBox="0 0 24 24" fill="none" class="lucide lucide-phone" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
          </div>
          <div class="contact-info">
              <h3 data-i18n="contact.phoneTitle">رقم الهاتف / واتساب</h3>
              <p class="contact-value"><a href="https://wa.me/201044679053" target="_blank" class="contact-link">+20 10 4467 9053</a></p>
          </div>
        </div>

        <!-- Email -->
        <div class="contact-card">
          <div class="contact-icon-wrapper">
            <svg viewBox="0 0 24 24" fill="none" class="lucide lucide-mail" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          </div>
          <div class="contact-info">
              <h3 data-i18n="contact.emailTitle">البريد الإلكتروني</h3>
              <p class="contact-value"><a href="mailto:m.sarhan4488@gmail.com" class="contact-link">m.sarhan4488@gmail.com</a></p>
          </div>
        </div>

        <!-- Address -->
        <div class="contact-card">
          <div class="contact-icon-wrapper">
            <svg viewBox="0 0 24 24" fill="none" class="lucide lucide-map-pin" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          </div>
          <div class="contact-info">
              <h3 data-i18n="contact.addressTitle">العنوان</h3>
              <p class="contact-value rtl-text" data-i18n="contact.addressValue">القاهره الشروق الحى الاول</p>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== FOOTER ===== -->
    <div id="footer-placeholder"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
